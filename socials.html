<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Forgexis — Соцсети</title>
  <meta name="description" content="Социальные сети проекта Forgexis">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --accent: #2f81f7;
      --bg-dark: #0b0b0b;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -200px, rgba(77,163,255,0.15), transparent),
        var(--bg-dark);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      padding-top: 90px;
    }

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(11, 11, 11, 0.65);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-weight: 600;
      font-size: 18px;
    }

    .nav-links a {
      margin-left: 22px;
      font-size: 14px;
      color: #ffffff;
      opacity: 0.7;
      text-decoration: none;
    }

    .nav-links a.active {
      opacity: 1;
      color: var(--accent);
    }

    main {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      animation: fadeUp 0.8s ease-out;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 24px;
    }

    .socials {
      display: grid;
      gap: 20px;
    }

    .social-card {
      padding: 20px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(47,129,247,0.18);
    }

    .social-card h3 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      opacity: 0.4;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-logo">Forgexis<button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Главная</a>
      <a href="about.html">О проекте</a>
      <a href="contact.html">Контакты</a>
      <a href="socials.html" class="active">Соцсети</a>
    </div>
  </div>
</nav>

<main>
  <h1>Соцсети</h1>

  <section class="socials">

    <div class="social-card">
      <h3>YouTube</h3>
      <a href="https://youtube.com/@forgexis_official?si=ERwfWo8s1dQu4swh">Forgexis YouTube</a>
    </div>

    <div class="social-card">
      <h3>TikTok</h3>
      <a href="https://www.tiktok.com/@forgexis?_r=1&_t=ZN-92kPEjCPF26">Forgexis TikTok</a>
    </div>

    <div class="social-card">
      <h3>Instagram</h3>
      <a href="https://www.instagram.com/forgexis__official?igsh=MWVmOG5ocXc2dnU2dw==">Forgexis Instagram</a>
    </div>

    <div class="social-card">
      <h3>Telegram</h3>
      <a href="https://t.me/Forgexis">Fprgexis Telegram</a>
    </div>

  </section>

  <footer>Forgexis © The project was created in 2024</footer>
</main>

</body>
</html>
