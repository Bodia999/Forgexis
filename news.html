<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Forgexis — О проекте</title>
  <meta name="description" content="Официальная информация о проекте Forgexis, его целях и контактах.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"> 



<style>

  :root {
      --accent: #2f81f7;
      --bg-dark: #0b0b0b;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -200px, rgba(77,163,255,0.15), transparent),
        var(--bg-dark);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      padding-top: 90px;

    }

    main {
      max-width: 600px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      backdrop-filter: blur(6px);
      animation: fadeUp 0.8s ease-out;
    }
.news-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 20px;
}

.news-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px;
  text-align: left;
  transition: 0.2s;
}

.news-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

.news-img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 12px;
}

.news-title {
  font-size: 18px;
  margin-bottom: 6px;
}

.news-date {
  font-size: 12px;
  opacity: 0.5;
  margin-bottom: 10px;
}

.news-text {
  font-size: 14px;
  opacity: 0.8;
}

  .nav-logo {
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.4px;
}

.nav-links a {
  margin-left: 22px;
  font-size: 14px;
  color: #ffffff;
  opacity: 0.7;
  text-decoration: none;
  transition: opacity 0.15s ease;
}

.nav-links a:hover {
  opacity: 1;
}

.nav-links a.active {
  opacity: 1;
  color: var(--accent);
}
    

    .menu-toggle {
  display: none;
  background: none;
  border: none;
  color: #ffffff;
  font-size: 22px;
  cursor: pointer;
}
</style>
</head>
<body>
  <nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-logo">Forgexis<button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Главная</a>
      <a href="about.html" class="active">О проекте</a>
      <a href="contact.html">Контакты</a>
      <a href="socials.html">Соцсети</a>
      <a href="news.html">Новости</a>
    </div>
  </div>
</nav>

<main>
<div class="news-list">

  <!-- ПОСТ -->
  <div class="news-card">
    <img src="images/test.jpg" class="news-img">

    <div class="news-title">Запуск сайта</div>
    <div class="news-date">20.04.2026</div>

    <div class="news-text">
      Сайт проекта Forgexis официально запущен.
    </div>

    <a href="https://t.me/Forgexis" class="more">Подробнее</a>
  </div>


  <!-- ЕЩЁ ПОСТ -->
  <div class="news-card">
    <div class="news-title">Новый проект</div>
    <div class="news-date">18.04.2026</div>

    <div class="news-text">
      Работаю над управлением ESP32 через веб.
    </div>
  </div>

</div>
</main>
  <script>
function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("show");
}
</script>
</body>
</html>
